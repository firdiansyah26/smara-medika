name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smaramedika
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/smaramedika?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/smaramedika?schema=public"
      AUTH_SECRET: "ci-dummy-secret-ci-dummy-secret-0000"
      AUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prisma generate, validate, migrate & seed
        run: |
          npx prisma generate
          npx prisma validate
          npx prisma migrate deploy
          npm run db:seed
      - name: Lint
        run: npm run lint
      - name: Test (unit + integration)
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E (Playwright)
        run: npm run test:e2e
