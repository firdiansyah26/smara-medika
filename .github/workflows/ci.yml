name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      # Nilai dummy — build memakai halaman dynamic (tanpa koneksi DB saat build).
      DATABASE_URL: "postgresql://user:pass@localhost:5432/smaramedika?schema=public"
      DIRECT_URL: "postgresql://user:pass@localhost:5432/smaramedika?schema=public"
      AUTH_SECRET: "ci-dummy-secret-ci-dummy-secret-0000"
      AUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prisma generate & validate
        run: |
          npx prisma generate
          npx prisma validate
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
